<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>F2-T01 — Briefings sintéticos</title><style>body{font:16px system-ui;max-width:1100px;margin:2rem auto;padding:0 1rem;background:#f7f7f5;color:#222}article{background:white;border:1px solid #ddd;border-radius:10px;padding:1rem;margin:1rem 0}.tag{display:inline-block;border:1px solid #aaa;border-radius:99px;padding:.2rem .6rem;margin:.2rem;font-size:.85rem}.note{background:#fff8dd;padding:.8rem;border-left:4px solid #e1b52e}</style><h1>F2-T01 — Briefings</h1><p class="note">Superfície local file-backed. Sintético/teste. Não publica, não gasta, não envia contatos e não integra sistemas.</p><main id="app"></main><script>fetch('../data/briefings.json').then(r=>r.json()).then(xs=>{app.innerHTML=xs.map(x=>`<article><h2>${x.id}</h2><p>${x.title} · <span class="tag">${x.state}</span> <span class="tag">${x.origin}</span> <span class="tag">${x.channel}</span></p><p><b>Serviço:</b> ${x.service} · <b>Briefing:</b> ${x.briefing_version} · <b>Criativo:</b> ${x.creative_version}</p><p><b>Hipótese:</b> Se ${x.hypothesis.se}; Para ${x.hypothesis.para}; Então ${x.hypothesis.entao}.</p><p><b>Janela:</b> ${x.window.type} · análise ${x.window.analysis_period}</p><p><b>Orçamento previsto:</b> ${x.budget.amount} ${x.budget.currency} · ${x.budget.origin} · ${x.budget.approval}</p></article>`).join('')})</script></html>
